name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Gerar APK
        run: |
          gradle :android:assembleRelease --no-daemon --stacktrace
          cp android/build/outputs/apk/release/android-release.apk ControleCaixa.apk
      - uses: actions/upload-artifact@v7
        with:
          name: ControleCaixa-apk
          path: ControleCaixa.apk
          if-no-files-found: error
