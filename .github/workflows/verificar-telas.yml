name: Verificar telas (teste)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Montar app
        run: gradle createDistributable --no-daemon
      - name: Abrir app e capturar telas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xdotool imagemagick >/dev/null
          mkdir -p "$HOME/ControleCaixa" capturas
          cp .github/teste/dados.json "$HOME/ControleCaixa/dados.json"
          Xvfb :99 -screen 0 1400x900x24 & sleep 3
          export DISPLAY=:99
          ./build/compose/binaries/main/app/ControleCaixa/bin/ControleCaixa > capturas/saida.txt 2>&1 &
          sleep 25
          xdotool search --name "Controle de Caixa" getwindowgeometry >> capturas/saida.txt 2>&1 || true
          import -window root capturas/1-lancamentos.png
          WID=$(xdotool search --name "Controle de Caixa" | head -1)
          eval $(xdotool getwindowgeometry --shell $WID)
          xdotool mousemove $((X + 765)) $((Y + 48)) click 1; sleep 3
          import -window root capturas/5-nova-entrada.png
          xdotool key Escape; sleep 2
          n=2
          for par in "232 resumo" "304 conferencia" "376 categorias"; do
            set -- $par
            xdotool mousemove $((X + 56)) $((Y + $1)) click 1; sleep 3
            import -window root capturas/$n-$2.png
            n=$((n + 1))
          done
          xdotool search --name "Controle de Caixa" >/dev/null && echo "APP AINDA ABERTO" >> capturas/saida.txt
      - name: Publicar capturas
        run: |
          cd capturas
          git init -q -b capturas && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm capturas
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" capturas
